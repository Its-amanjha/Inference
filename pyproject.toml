[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inference"
version = "0.1.0"
description = "Self-hosted n8n fleet control and observability"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<0.29", "httpcore>=1,<2", "anyio>=4,<5",
  "aiosqlite>=0.20,<1", "cryptography>=44", "pydantic>=2.10,<3",
  "opentelemetry-proto>=1.30,<2", "aiodocker>=0.24,<1",
  "pyotp>=2.9,<3", "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
"backend" = ["modules/*/manifest.json"]
